  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

de-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Martian Mono';\n  font-style: normal;\n  font-weight: 300 600;\n  font-stretch: 75% 112.5%;\n  font-display: swap;\n  src: url(\"a9578d62-4d55-468f-b634-1650b0acfafe\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\nbody{margin:0;background:#0B0A1F;color:#F2EEE6;font-family:'Hanken Grotesk',sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}\na{color:#7FE6F2;text-decoration-thickness:1px;text-underline-offset:3px}a:hover{color:#A8F0F8}\n*{box-sizing:border-box}\n@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}\n<\u002Fstyle>\n\n<\u002Fhelmet>\n\n<div style=\"min-height:100vh;background:radial-gradient(1px 1px at 12% 18%,#F2EEE6 50%,transparent 51%),radial-gradient(1px 1px at 78% 9%,#F2EEE6 50%,transparent 51%),radial-gradient(1.5px 1.5px at 64% 32%,#7FE6F2 50%,transparent 51%),radial-gradient(1px 1px at 33% 44%,#A9A3C2 50%,transparent 51%),radial-gradient(1px 1px at 90% 58%,#F2EEE6 50%,transparent 51%),radial-gradient(1px 1px at 8% 72%,#A9A3C2 50%,transparent 51%),radial-gradient(1.5px 1.5px at 52% 88%,#FFD27A 50%,transparent 51%),radial-gradient(900px 600px at 85% -10%,#2A1F5C 0%,transparent 70%),#0B0A1F\">\n<div style=\"max-width:1200px;margin:0 auto;padding:clamp(24px,5vw,72px) clamp(20px,4vw,56px) 120px;display:flex;flex-direction:column;gap:96px\">\n\n<header style=\"display:flex;flex-direction:column;gap:24px;padding-top:24px\">\n<div style=\"display:flex;flex-wrap:wrap;gap:12px 24px;font:400 12px/1.4 'Martian Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:#A9A3C2\">\n<span>Skyward Studio<\u002Fspan><span>Design system v2 · “Routes”<\u002Fspan><span style=\"color:#7FE6F2\">Active system<\u002Fspan><\u002Fdiv><div style=\"display:flex\"><a href=\"Skyward Mappa.dc.html?return=1#/work/skyward\" style=\"min-height:48px;display:inline-flex;align-items:center;gap:10px;padding:0 18px;border:1px solid rgba(242,238,230,.4);border-radius:4px;color:#F2EEE6;text-decoration:none;font:500 16px 'Hanken Grotesk',sans-serif;letter-spacing:0;text-transform:none;transition:background 160ms ease-out\" style-hover=\"background:#241F4D\" style-focus=\"outline:2px solid #7FE6F2;outline-offset:3px\"><span aria-hidden=\"true\">←<\u002Fspan>Back to the Skyward case study<\u002Fa>\n<\u002Fdiv>\n<h1 style=\"margin:0;font:700 clamp(56px,9vw,128px)/.9 'Bricolage Grotesque',sans-serif;font-variation-settings:'wdth' 78,'opsz' 96;letter-spacing:-.03em;text-wrap:balance\">Every page<br>is a star.<\u002Fh1>\n<p style=\"margin:0;max-width:640px;font-size:19px;line-height:1.6;color:#D9D4E6;text-wrap:pretty\">Skyward’s site becomes a star map. Sections are systems to reach: pick a destination, read the distance, jump. Content arrives still and readable; motion is only for the journey.<\u002Fp>\n<\u002Fheader>\n\n<section style=\"display:flex;flex-direction:column;gap:32px\">\n<div style=\"display:flex;align-items:baseline;gap:16px;border-bottom:1px solid rgba(242,238,230,.14);padding-bottom:16px\"><span style=\"font:500 12px 'Martian Mono',monospace;color:#7FE6F2\">01<\u002Fspan><h2 style=\"margin:0;font:600 36px/1.1 'Bricolage Grotesque',sans-serif;font-variation-settings:'wdth' 85\">Principles<\u002Fh2><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1px;background:rgba(242,238,230,.14);border:1px solid rgba(242,238,230,.14)\">\n<div style=\"background:#0B0A1F;padding:28px;display:flex;flex-direction:column;gap:10px\"><span style=\"font:400 12px 'Martian Mono',monospace;color:#A9A3C2\">A<\u002Fspan><h3 style=\"margin:0;font:600 22px/1.2 'Bricolage Grotesque',sans-serif\">Navigation is a map<\u002Fh3><p style=\"margin:0;color:#D9D4E6;font-size:16px\">The home is a navigable galaxy: rotate, zoom, pan. Every destination is visible, named and reachable.<\u002Fp><\u002Fdiv>\n<div style=\"background:#0B0A1F;padding:28px;display:flex;flex-direction:column;gap:10px\"><span style=\"font:400 12px 'Martian Mono',monospace;color:#A9A3C2\">B<\u002Fspan><h3 style=\"margin:0;font:600 22px/1.2 'Bricolage Grotesque',sans-serif\">Every jump has a distance<\u002Fh3><p style=\"margin:0;color:#D9D4E6;font-size:16px\">A system’s distance is its reading time. The jump lasts proportionally, between 0.9 and 1.8 seconds.<\u002Fp><\u002Fdiv>\n<div style=\"background:#0B0A1F;padding:28px;display:flex;flex-direction:column;gap:10px\"><span style=\"font:400 12px 'Martian Mono',monospace;color:#A9A3C2\">C<\u002Fspan><h3 style=\"margin:0;font:600 22px/1.2 'Bricolage Grotesque',sans-serif\">Every system has a color<\u002Fh3><p style=\"margin:0;color:#D9D4E6;font-size:16px\">Color identifies the system everywhere: map, route, card, system map. Text always sits on a dark ground and never moves while reading.<\u002Fp><\u002Fdiv>\n<div style=\"background:#0B0A1F;padding:28px;display:flex;flex-direction:column;gap:10px\"><span style=\"font:400 12px 'Martian Mono',monospace;color:#A9A3C2\">D<\u002Fspan><h3 style=\"margin:0;font:600 22px/1.2 'Bricolage Grotesque',sans-serif\">Always an alternative<\u002Fh3><p style=\"margin:0;color:#D9D4E6;font-size:16px\">List view instead of the map, a fade instead of the jump, keyboard instead of dragging.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"display:flex;flex-direction:column;gap:32px\">\n<div style=\"display:flex;align-items:baseline;gap:16px;border-bottom:1px solid rgba(242,238,230,.14);padding-bottom:16px\"><span style=\"font:500 12px 'Martian Mono',monospace;color:#7FE6F2\">02<\u002Fspan><h2 style=\"margin:0;font:600 36px/1.1 'Bricolage Grotesque',sans-serif;font-variation-settings:'wdth' 85\">Color<\u002Fh2><\u002Fdiv>\n<p style=\"margin:0;max-width:640px;color:#D9D4E6\">One theme, dark: we’re in space. Long reading (case studies) happens on space/surface with text/primary. Contrast ratios measured on space/void.<\u002Fp>\n\n<h3 style=\"margin:16px 0 0;font:500 12px 'Martian Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:#A9A3C2;margin-top:8px\">Base<\u002Fh3>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px\">\n<div style=\"display:flex;flex-direction:column;gap:10px\"><div style=\"height:96px;border-radius:4px;background:#0B0A1F;border:1px solid rgba(242,238,230,.2)\"><\u002Fdiv><div style=\"font:500 13px 'Martian Mono',monospace\">space/void<\u002Fdiv><div style=\"font:400 12px 'Martian Mono',monospace;color:#A9A3C2\">#0B0A1F · background<\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:10px\"><div style=\"height:96px;border-radius:4px;background:#15132E\"><\u002Fdiv><div style=\"font:500 13px 'Martian Mono',monospace\">space/surface<\u002Fdiv><div style=\"font:400 12px 'Martian Mono',monospace;color:#A9A3C2\">#15132E · panels (94%)<\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:10px\"><div style=\"height:96px;border-radius:4px;background:#241F4D\"><\u002Fdiv><div style=\"font:500 13px 'Martian Mono',monospace\">space/raised<\u002Fdiv><div style=\"font:400 12px 'Martian Mono',monospace;color:#A9A3C2\">#241F4D · hover<\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:10px\"><div style=\"height:96px;border-radius:4px;background:#F2EEE6;color:#0B0A1F;padding:10px;font:500 12px 'Martian Mono',monospace;display:flex;align-items:flex-end;justify-content:space-between\"><span>16.8:1<\u002Fspan><\u002Fdiv><div style=\"font:500 13px 'Martian Mono',monospace\">text/primary<\u002Fdiv><div style=\"font:400 12px 'Martian Mono',monospace; -variation-settings:'wdth' 88\">Home<\u002Fspan>\n<span style=\"font:400 12px 'Martian Mono',monospace;letter-spacing:.06em;color:#A9A3C2\">SYS-00 · 1 min<\u002Fspan>\n<span style=\"margin-top:6px;width:max-content;display:inline-flex;align-items:center;gap:8px;padding:5px 11px 5px 9px;border-radius:99px;background:rgba(11,10,31,.78);border:1px solid #FFB38A;font:500 12px 'Martian Mono',monospace;letter-spacing:.1em;color:#FFB38A;box-shadow:0 0 18px rgba(255,179,138,.35)\"><span style=\"width:8px;height:8px;border:1.5px solid #FFB38A;transform:rotate(45deg)\"><\u002Fspan>YOU ARE HERE<\u002Fspan>\n<\u002Fdiv>\n<p style=\"margin:0;flex:1 1 260px;color:#A9A3C2;font-size:15px\">“You are here”: two concentric sonar waves (1.8s cycle) centered on the point, plus a label in the system color. It follows the user: after a jump it moves to the system reached. Dashed routes always start here toward every other system, Home included. With reduced motion the wave stays still.<\u002Fp>\n<\u002Fdiv>\n<p style=\"margin:0;color:#A9A3C2;font-size:15px;max-width:680px\">Touch area always 44×44. The visited state changes shape (ring), not only color. The system name is always written next to the star; the text block aligns to the top, so the point stays at the center of the waves. Near the right edge the label flips to the left.<\u002Fp>\n\n<h3 style=\"margin:16px 0 0;font:500 12px 'Martian Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:#A9A3C2\">Routes<\u002Fh3>\n<div style=\"display:flex;flex-wrap:wrap;gap:32px;align-items:center;background:#15132E;border-radius:4px;padding:24px\">\n<svg width=\"220\" height=\"40\" sc-camel-view-box=\"0 0 220 40\" aria-hidden=\"true\"><path d=\"M10 20 L210 20\" stroke=\"rgba(169,163,194,.38)\" stroke-width=\"1\" stroke-dasharray=\"2 7\"><\u002Fpath><\u002Fsvg><span style=\"font:400 12px 'Martian Mono',monospace;color:#A9A3C2\">rest · 2/7 · flows 4px/s<\u002Fspan>\n<svg width=\"220\" height=\"40\" sc-camel-view-box=\"0 0 220 40\" aria-hidden=\"true\"><path d=\"M10 20 L210 20\" stroke=\"#FFD27A\" stroke-width=\"1.25\" stroke-dasharray=\"6 6\"><\u002Fpath><\u002Fsvg><span style=\"font:400 12px 'Martian Mono',monospace;color:#A9A3C2\">active · system color · 14px/s<\u002Fspan>\n<\u002Fdiv>\n\n<h3 style=\"margin:16px 0 0;font:500 12px 'Martian Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:#A9A3C2\">Map controls<\u002Fh3>\n<div style=\"display:flex;flex-wrap:wrap;gap:8px;align-items:center\">\n<button aria-label=\"Zoom out\" style=\"min-height:44px;min-width:44px;padding:0 12px;border:1px solid rgba(242,238,230,.32);border-radius:4px;background:rgba(11,10,31,.55);color:#F2EEE6;display:grid;place-items:center;cursor:pointer\" style-hover=\"background:#241F4D;border-color:#F2EEE6\" style-focus=\"outline:2px solid #7FE6F2;outline-offset:3px\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 16 16\" aria-hidden=\"true\"><path d=\"M3 8h10\" stroke=\"currentColor\" stroke-width=\"1.5\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n<button aria-label=\"Zoom in\" style=\"min-height:44px;min-width:44px;padding:0 12px;border:1px solid rgba(242,238,230,.32);border-radius:4px;background:rgba(11,10,31,.55);color:#F2EEE6;display:grid;place-items:center;cursor:pointer\" style-hover=\"background:#241F4D;border-color:#F2EEE6\" style-focus=\"outline:2px solid #7FE6F2;outline-offset:3px\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 16 16\" aria-hidden=\"true\"><path d=\"M3 8h10M8 3v10\" stroke=\"currentColor\" stroke-width=\"1.5\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n<button style=\"min-height:44px;padding:0 12px;border:1px solid rgba(242,238,230,.32);border-radius:4px;background:rgba(11,10,31,.55);color:#F2EEE6;font:500 15px 'Hanken Grotesk',sans-serif;display:flex;gap:8px;align-items:center;cursor:pointer\" style-hover=\"background:#241F4D;border-color:#F2EEE6\" style-focus=\"outline:2px solid #7FE6F2;outline-offset:3px\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 16 16\" aria-hidden=\"true\"><circle cx=\"8\" cy=\"8\" r=\"5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\"><\u002Fcircle><path d=\"M8 0v4M8 12v4M0 8h4M12 8h4\" stroke=\"currentColor\" stroke-width=\"1.4\"><\u002Fpath><\u002Fsvg>Recenter<span style=\"font:400 12px 'Martian Mono',monospace;color:#A9A3C2\">R<\u002Fspan><\u002Fbutton>\n<span style=\"font:400 12px 'Martian Mono',monospace;color:#A9A3C2;margin-left:12px\">drag · rotate — shift/right · pan — scroll/pinch · zoom — Q/E · rotate — +/− · zoom<\u002Fspan>\n<\u002Fdiv>\n\n<h3 style=\"margin:16px 0 0;font:500 12px 'Martian Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:#A9A3C2\">System card · appears on selection<\u002Fh3>\n<div style=\"display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start\">\n<div style=\"width:min(100%,340px);background:rgba(21,19,46,.92);border:1px solid rgba(242,238,230,.18);border-radius:6px;padding:20px;display:flex;flex-direction:column;gap:14px\">\n<div style=\"display:flex;flex-direction:column;gap:2px;font:400 12px 'Martian Mono',monospace;letter-spacing:.06em;color:#A9A3C2\"><span>SYS-01 · distance 4 min<\u002Fspan><span style=\"color:#D9D4E6\">Route · Home → Work<\u002Fspan><\u002Fdiv>\n<div style=\"font:650 36px/1 'Bricolage Grotesque',sans-serif;font-variation-settings:'wdth' 80\">Work<\u002Fdiv>\n<p style=\"margin:0;color:#D9D4E6;font-size:15px;line-height:1.55\">The studio’s first project: Skyward.<\u002Fp>\n<div style=\"display:flex;gap:8px;flex-wrap:wrap\"><span style=\"font:400 12px 'Martian Mono',monospace;padding:4px 8px;border:1px solid rgba(242,238,230,.2);border-radius:99px;color:#D9D4E6\">1 planet<\u002Fspan><span style=\"font:400 12px 'Martian Mono',monospace;padding:4px 8px;border:1px solid rgba(242,238,230,.22);border-radius:99px;color:#A9A3C2\">not visited<\u002Fspan><\u002Fdiv>\n<button style=\"min-height:52px;border:0;border-radius:4px;background:#7FE6F2;color:#0B0A1F;font:600 16px 'Hanken Grotesk',sans-serif;display:flex;align-items:center;justify-content:space-between;padding:0 18px;cursor:pointer;transition:filter 160ms ease-out\" style-hover=\"filter:brightness(1.12)\" style-focus=\"outline:2px solid #7FE6F2;outline-offset:3px\"><span>Jump to Work<\u002Fspan><span style=\"font:400 12px 'Martian Mono',monospace\">ENTER<\u002Fspan><\u002Fbutton>\n<\u002Fdiv>\n<div style=\"flex:1 1 260px;display:flex;flex-direction:column;gap:10px;color:#A9A3C2;font-size:15px\">\n<p style=\"margin:0\">Fixed content: code, distance, route from the current position, name, one-line description, planet count, visit state.<\u002Fp>\n<p style=\"margin:0\">The primary button takes the system color. If it’s the system you’re in, it becomes “Enter …”; on Home it becomes “Back to Home”. Desktop: anchored right. Mobile: bottom sheet.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<h3 style=\"margin:16px 0 0;font:500 12px 'Martian Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:#A9A3C2\">System map · section index<\u002Fh3>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px;align-items:start\">\n<div style=\"position:relative;height:300px;background:#0B0A1F;border:1px solid rgba(242,238,230,.12);border-radius:6px;overflow:hidden\">\n<svg width=\"100%\" height=\"300\" sc-camel-view-box=\"0 0 440 300\" sc-camel-preserve-aspect-ratio=\"xMidYMid meet\" style=\"position:absolute;inset:0\" aria-hidden=\"true\">\n<ellipse cx=\"220\" cy=\"150\" rx=\"80\" ry=\"29\" fill=\"none\" stroke=\"rgba(242,238,230,.2)\"><\u002Fellipse>\n<ellipse cx=\"220\" cy=\"150\" rx=\"135\" ry=\"49\" fill=\"none\" stroke=\"#FF7A6B\" stroke-opacity=\".8\" stroke-width=\"1.4\"><\u002Fellipse>\n<ellipse cx=\"220\" cy=\"150\" rx=\"190\" ry=\"68\" fill=\"none\" stroke=\"rgba(242,238,230,.2)\"><\u002Fellipse>\n<\u002Fsvg>\n<span style=\"position:absolute;left:50%;top:50%;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:50%;background:radial-gradient(circle,#FFFFFF 0%,#FF7A6B 26%,rgba(255,122,107,.35) 48%,rgba(255,122,107,0) 72%)\"><\u002Fspan>\n<span style=\"position:absolute;left:calc(50% - 80px);top:calc(50% + 12px);width:22px;height:22px;margin:-11px;border-radius:50%;background:radial-gradient(circle at 34% 30%,#F4F8FF 0%,#9FB6E6 40%,#1C2A4A 100%);box-shadow:0 0 18px 2px rgba(255,122,107,.18)\"><\u002Fspan>\n<span style=\"position:absolute;left:calc(50% + 118px);top:calc(50% + 24px);width:34px;height:34px;margin:-17px;border-radius:50%;background:radial-gradient(circle at 34% 30%,#FFE2DA 0%,#E2654F 40%,#4A1510 100%);box-shadow:0 0 0 2px #FF7A6B,0 0 28px 6px rgba(255,122,107,.45)\"><\u002Fspan>\n<span style=\"position:absolute;left:calc(50% - 150px);top:calc(50% - 42px);width:26px;height:26px;margin:-13px;border-radius:50%;background:radial-gradient(circle at 34% 30%,#E6FFE9 0%,#5DC878 40%,#0F3A1C 100%);opacity:.75\"><\u002Fspan>\n<span style=\"position:absolute;left:calc(50% + 140px);top:calc(50% + 10px);display:flex;flex-direction:column\"><span style=\"font:400 12px 'Martian Mono',monospace;color:#FF7A6B\">03<\u002Fspan><span style=\"font:600 15px 'Bricolage Grotesque',sans-serif\">Planet<\u002Fspan><\u002Fspan>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:10px;color:#A9A3C2;font-size:15px\">\n<p style=\"margin:0\">Opens on entering a system. Central star in the system color (pulses ±5%), tilted elliptical orbits (ratio 0.36), one planet per page section.<\u002Fp>\n<p style=\"margin:0\">Planets orbit slower toward the outside and pass in front of/behind the star (scale .8–1.08, opacity .7–1). Size = section weight. Hover, focus or selection stop all orbits; the selected orbit takes on color.<\u002Fp>\n<p style=\"margin:0\">Each planet is offset ~140° from the previous one, so they never start overlapping.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px;align-items:start\">\n<div style=\"display:flex;flex-direction:column;gap:8px\">\n<span style=\"font:400 12px 'Martian Mono',monospace;text-transform:uppercase;letter-spacing:.1em;color:#A9A3C2\">Index<\u002Fspan>\n<ol style=\"list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border-top:1px solid rgba(242,238,230,.14)\">\n<li style=\"border-bottom:1px solid rgba(242,238,230,.14)\"><button aria-pressed=\"false\" style=\"width:100%;min-height:52px;display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 8px;border:0;background:transparent;color:#F2EEE6;text-align:left;cursor:pointer;border-radius:2px\" style-hover=\"background:rgba(36,31,77,.7)\" style-focus=\"outline:2px solid #7FE6F2;outline-offset:2px\"><span style=\"font:400 12px 'Martian Mono',monospace;letter-spacing:.06em;color:#A9A3C2\">01<\u002Fspan><span style=\"display:flex;flex-direction:column\"><span style=\"font:600 17px/1.2 'Bricolage Grotesque',sans-serif\">Section<\u002Fspan><span style=\"font-size:14px;color:#A9A3C2\">detail<\u002Fspan><\u002Fspan><span style=\"width:12px;height:12px;border-radius:50%;background:#9FB6E6\"><\u002Fspan><\u002Fbutton><\u002Fli><li style=\"border-bottom:1px solid rgba(242,238,230,.14)\"><button aria-pressed=\"false\" style=\"width:100%;min-height:52px;display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 8px;border:0;background:transparent;color:#F2EEE6;text-align:left;cursor:pointer;border-radius:2px\" style-hover=\"background:rgba(36,31,77,.7)\" style-focus=\"outline:2px solid #7FE6F2;outline-offset:2px\"><span style=\"font:400 12px 'Martian Mono',monospace;letter-spacing:.06em;color:#A9A3C2\">02<\u002Fspan><span style=\"display:flex;flex-direction:column\"><span style=\"font:600 17px/1.2 'Bricolage Grotesque',sans-serif\">Section<\u002Fspan><span style=\"font-size:14px;color:#A9A3C2\">detail<\u002Fspan><\u002Fspan><span style=\"width:12px;height:12px;border-radius:50%;background:#E6B04E\"><\u002Fspan><\u002Fbutton><\u002Fli><li style=\"border-bottom: tian Mono',monospace\">ENTER<\u002Fspan><\u002Fbutton>\n<span style=\"font:400 12px 'Martian Mono',monospace;color:#A9A3C2\">planet card · bottom right<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<h3 style=\"margin:16px 0 0;font:500 12px 'Martian Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:#A9A3C2\">Buttons<\u002Fh3>\n<div style=\"display:flex;flex-wrap:wrap;gap:16px;align-items:center\">\n<button style=\"min-height:48px;padding:0 22px;border:0;border-radius:4px;background:#7FE6F2;color:#0B0A1F;font:600 16px 'Hanken Grotesk',sans-serif;cursor:pointer;transition:background 160ms ease-out\" style-hover=\"background:#A8F0F8\" style-focus=\"outline:2px solid #7FE6F2;outline-offset:3px\">Jump<\u002Fbutton>\n<button style=\"min-height:48px;padding:0 22px;border:1px solid rgba(242,238,230,.4);border-radius:4px;background:transparent;color:#F2EEE6;font:500 16px 'Hanken Grotesk',sans-serif;cursor:pointer;transition:background 160ms ease-out,border-color 160ms ease-out\" style-hover=\"background:#241F4D;border-color:#F2EEE6\" style-focus=\"outline:2px solid #7FE6F2;outline-offset:3px\">Open the map<\u002Fbutton>\n<button style=\"min-height:48px;padding:0 12px;border:0;background:transparent;color:#7FE6F2;font:500 16px 'Hanken Grotesk',sans-serif;text-decoration:underline;text-underline-offset:4px;cursor:pointer\" style-hover=\"color:#A8F0F8\" style-focus=\"outline:2px solid #7FE6F2;outline-offset:3px\">List view<\u002Fbutton>\n<button aria-label=\"Close card\" style=\"width:48px;height:48px;border:1px solid rgba(242,238,230,.3);border-radius:4px;background:transparent;color:#F2EEE6;display:grid;place-items:center;cursor:pointer\" style-hover=\"background:#241F4D\" style-focus=\"outline:2px solid #7FE6F2;outline-offset:3px\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 16 16\" aria-hidden=\"true\"><path d=\"M3 3l10 10M13 3L3 13\" stroke=\"currentColor\" stroke-width=\"1.5\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n<\u002Fdiv>\n\n<h3 style=\"margin :uppercase;color:#A9A3C2\"><span>Token<\u002Fspan><span>Duration<\u002Fspan><span>Use and curve<\u002Fspan><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:minmax(140px,1fr) minmax(90px,.6fr) minmax(0,2fr);gap:16px;padding:16px 0;border-bottom:1px solid rgba(242,238,230,.14)\"><span style=\"font:500 14px 'Martian Mono',monospace\">motion/entry<\u002Fspan><span style=\"font:400 14px 'Martian Mono',monospace;color:#7FE6F2\">800ms<\u002Fspan><span style=\"color:#D9D4E6\">End of jump: the arrival star expands to fill the screen, trails and HUD fade.<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:minmax(140px,1fr) minmax(90px,.6fr) minmax(0,2fr);gap:16px;padding:16px 0;border-bottom:1px solid rgba(242,238,230,.14)\"><span style=\"font:500 14px 'Martian Mono',monospace\">motion/emerge<\u002Fspan><span style=\"font:400 14px 'Martian Mono',monospace;color:#7FE6F2\">1300ms<\u002Fspan><span style=\"color:#D9D4E6\">Inside the system: the star recedes, orbits and planets expand from the center with a brief swirl.<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:minmax(140px,1fr) minmax(90px,.6fr) minmax(0,2fr);gap:16px;padding:16px 0;border-bottom:1px solid rgba(242,238,230,.14)\"><span style=\"font:500 14px 'Martian Mono',monospace\">motion/intro<\u002Fspan><span style=\"font:400 14px 'Martian Mono',monospace;color:#7FE6F2\">1.5s + 2.1s<\u002Fspan><span style=\"color:#D9D4E6\">Traced logo (1.5s), staggered diagnostics, hold 1.2s. The jump starts from the button; at 62% it hands over to the approach.<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:minmax(140px,1fr) minmax(90px,.6fr) minmax(0,2fr);gap:16px;padding:16px 0;border-bottom:1px solid rgba(242,238,230,.14)\"><span style=\"font:500 14px 'Martian Mono',monospace\">motion/approach<\u002Fspan><span style=\"font:400 14px 'Martian Mono',monospace;color:#7FE6F2\">4200ms<\u002Fspan><span style=\"color:#D9D4E6\">After the intro: camera from far away to the starting view, ease-out braking; leftover trails slow down and fade in 1.1s over the map.<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:minmax(140px,1fr) minmax(90px,.6fr) minmax(0,2fr);gap:16px;padding:16px 0;border-bottom:1px solid rgba(242,238,230,.14)\"><span style=\"font:500 14px 'Martian Mono',monospace\">motion/land<\u002Fspan><span style=\"font:400 14px 'Martian Mono',monospace;color:#7FE6F2\">760 + 420ms<\u002Fspan><span style=\"color:#D9D4E6\">Landing: the planet expands from its point to full screen, then fades into the page.<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:minmax(140px,1fr) minmax(90px,.6fr) minmax(0,2fr);gap:16px;padding:16px 0;border-bottom:1px solid rgba(242,238,230,.14)\"><span style=\"font:500 14px 'Martian Mono',monospace\">motion/planet-select<\u002Fspan><span style=\"font:400 14px 'Martian Mono',monospace;color:#7FE6F2\">380ms<\u002Fspan><span style=\"color:#D9D4E6\">Planet in the system map: from glowing point to solid, crisp sphere (scale .3→1).<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:minmax(140px,1fr) minmax(90px,.6fr) minmax(0,2fr);gap:16px;padding:16px 0;border-bottom:1px solid rgba(242,238,230,.14)\"><span style=\"font:500 14px 'Martian Mono',monospace\">motion/egg<\u002Fspan><span style=\"font:400 14px 'Martian Mono',monospace;color:#7FE6F2\">2800ms<\u002Fspan><span style=\"color:#D9D4E6\">Black hole: spiral approach, darkness, return Home with a flash.<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:minmax(140px,1fr) minmax(90px,.6fr) minmax(0,2fr);gap:16px;padding:16px 0;border-bottom:1px solid rgba(242,238,230,.14)\"><span style=\"font:500 14px 'Martian Mono',monospace\">motion/tap<\u002Fspan><span style=\"font:400 14px 'Martian Mono',monospace;color:#7FE6F2\">120ms<\u002Fspan><span style=\"color:#D9D4E6\">Button press. ease-out.<\u002Fspan><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:minmax(140px,1fr) "><span style=\"font:500 14px 'Martian Mono',monospace\">motion/hold<\u002Fspan><span style=\"font:400 14px 'Martian Mono',monospace;color:#7FE6F2\">180 + 850ms<\u002Fspan><span style=\"color:#D9D4E6\">Hold on a system: 180ms tolerance, then the ring fills. Releasing early = cancel.<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:minmax(140px,1fr) minmax(90px,.6fr) minmax(0,2fr);gap:16px;padding:16px 0;border-bottom:1px solid rgba(242,238,230,.14)\"><span style=\"font:500 14px 'Martian Mono',monospace\">motion/sonar<\u002Fspan><span style=\"font:400 14px 'Martian Mono',monospace;color:#7FE6F2\">1.8s<\u002Fspan><span style=\"color:#D9D4E6\">“You are here” waves, two in antiphase.<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:minmax(140px,1fr) minmax(90px,.6fr) minmax(0,2fr);gap:16px;padding:16px 0;border-bottom:1px solid rgba(242,238,230,.14)\"><span style=\"font:500 14px 'Martian Mono',monospace\">motion/planet<\u002Fspan><span style=\"font:400 14px 'Martian Mono',monospace;color:#7FE6F2\">0.16 rad/s ÷ n^.75<\u002Fspan><span style=\"color:#D9D4E6\">Planet orbits in the system map. They stop within 400ms on hover/focus/selection.<\u002Fspan><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:minmax(140px,1fr) minmax(90px,.6fr) minmax(0,2fr);gap:16px;padding:16px 0;border-bottom:1px solid rgba(242,238,230,.14)\"><span style=\"font:500 14px 'Martian Mono',monospace\">motion/jump<\u002Fspan><span style=\"font:400 14px 'Martian Mono',monospace;color:#7FE6F2\">1600–2600ms<\u002Fspan><span style=\"color:#D9D4E6\">Jump: the map recedes and fades (24%), cubic acceleration, cruise, braking (34%). 3D flight through a star field with gradient trails, streaking nebulae, slight roll and shake in cruise, a gentle blue shift. The arrival star grows at the center and becomes the system map’s star. HUD: destination and falling distance. Return Home 1500ms.<\u002Fspan><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:minmax(140px,1fr) minmax(90px,.6fr) minmax(0,2fr);gap:16px;padding:16px 0;border-bottom:1px solid rgba(242,238,230,.14)\"><span style=\"font:500 14px 'Martian Mono',monospace\">motion/ambient<\u002Fspan><span style=\"font:400 14px 'Martian Mono',monospace;color:#7FE6F2\">9–23s<\u002Fspan><span style=\"color:#D9D4E6\">Individual star twinkle, breathing halos, nebula veils. A shooting star every 6–15s. Paused when the tab is hidden.<\u002Fspan><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:minmax(140px,1fr) minmax(90px,.6fr) minmax(0,2fr);gap:16px;padding:16px 0;border-bottom:1px solid rgba(242,238,230,.14)\"><span style=\"font:500 14px 'Martian Mono',monospace\">reduced-motion<\u002Fspan><span style=\"font:400 14px 'Martian Mono',monospace;color:#7FE6F2\">240ms<\u002Fspan><span style=\"color:#D9D4E6\">Jump replaced by a fade, static background, no auto-rotation, still sonar, instant camera, focus moved to the destination.<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"display:flex;flex-direction:column;gap:32px\">\n<div style=\"display:flex;align-items:baseline;gap:16px;border-bottom:1px solid rgba(242,238,230,.14);padding-bottom:16px\"><span style=\"font:500 12px 'Martian Mono',monospace;color:#7FE6F2\">06<\u002Fspan><h2 style=\"margin:0;font:600 36px/1.1 'Bricolage Grotesque',sans-serif;font-variation-settings:'wdth' 85\">Space and grid<\u002Fh2><\u002Fdiv>\n<div style=\"display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end\">\n<div style=\"display:flex;flex-direction:column;gap:8px;align-items:center\"><div style=\"width:4px;height:4px;background:#7FE6F2\"><\u002Fdiv><span style=\"font:400 12px 'Martian Mono',monospace;color:#A9A3C2\">4<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:8px;align-items:center\"><div style=\"width:8px;height:8px;background:#7FE6F2\"><\u002Fdiv><span style=\"font:400 12px 'Martian Mono',monospace;color:#A9A3C2\">8<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:8px;align-items:center\"><div style=\"width:16px;height:16px;background:#7FE6F2\"><\u002Fdiv><span style=\"font:400 12px 'Martian Mono',monospace;color:#A9A3C2\">16<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:8px;align-items:center\"><div style=\"width:24px;height:24px;background:#7FE6F2\"><\u002Fdiv><span style=\"font:400 12px 'Martian Mono',monospace;color:#A9A3C2\">24<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:8px;align-items:center\"><div style=\"width:32px;height:32px;background:#7FE6F2\"><\u002Fdiv><span style=\"font:400 12px 'Martian Mono',monospace;color:#A9A3C2\">32<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:8px;align-items:center\"><div style=\"width:48px;height:48px;background:#7FE6F2\"><\u002Fdiv><span style=\"font:400 12px 'Martian Mono',monospace;color:#A9A3C2\">48<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:8px;align-items:center\"><div style=\"width:64px;height:64px;background:#7FE6F2\"><\u002Fdiv><span style=\"font:400 12px 'Martian Mono',monospace;color:#A9A3C2\">64<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:8px;align-items:center\"><div style=\"width:96px;height:96px;background:#7FE6F2\"><\u002Fdiv><span style=\"font:400 12px 'Martian Mono',monospace;color:#A9A3C2\">96<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<p style=\"margin:0;color:#D9D4E6;max-width:680px\">System content on 12 columns, max 1200px, fluid margins 20–56px. Reading text never exceeds 68 characters. HUD anchored to the edges with safe-area-inset. Radii: 4px controls, 6px panels, 99px chips.<\u002Fp>\n<\u002Fsection>\n\n<section style=\"display:flex;flex-direction:column;gap:32px\">\n<div style=\"display:flex;align-items:baseline;gap:16px;border-bottom:1px solid rgba(242,238,230,.14);padding-bottom:16px\"><span style=\"font:500 12px 'Martian Mono',monospace;color:#7FE6F2\">08<\u002Fspan><h2 style=\"margin:0;font:600 36px/1.1 'Bricolage Grotesque',sans-serif;font-variation-settings:'wdth' 85\">Experience · intro, guide, pages<\u002Fh2><\u002Fdiv>\n\n<h3 style=\"margin:16px 0 0;font:500 12px 'Martian Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:#A9A3C2\">Planet in the system map<\u002Fh3>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px\">\n<div style=\"background:#15132E;border-radius:4px;padding:24px 16px;display:flex;flex-direction:column;align-items:center;gap:16px;min-height:150px;justify-content:center\"><div style=\"position:relative;width:60px;height:60px;display:grid;place-items:center\"><span style=\"position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,rgba(156,124,240,.55),rgba(156,124,240,0) 68%)\"><\u002Fspan><span style=\"width:12px;height:12px;border-radius:50%;background:#9C7CF0;box-shadow:0 0 16px 4px rgba(156,124,240,.42)\"><\u002Fspan><\u002Fdiv><span style=\"font:400 12px 'Martian Mono',monospace;letter-spacing:.06em;color:#A9A3C2\">rest · glowing point<\u002Fspan><\u002Fdiv>\n<div style=\"background:#15132E;border-radius:4px;padding:24px 16px;display:flex;flex-direction:column;align-items:center;gap:16px;min-height:150px;justify-content:center\"><div style=\"position:relative;width:60px;height:60px;display:grid;place-items:center\"><span style=\"position:absolute;width:28px;height:28px;border-radius:50%;border:1.5px solid rgba(156,124,240,.7)\"><\u002Fspan><span style=\"width:14px;height:14px;border-radius:50%;background:#9C7CF0;box-shadow:0 0 24px 7px rgba(156,124,240,.6)\"><\u002Fspan><\u002Fdiv><span style=\"font:400 12px 'Martian Mono',monospace;letter-spacing:.06em;color:#A9A3C2\">hover · ring<\u002Fspan><\u002Fdiv>\n<div style=\"background:#15132E;border-radius:4px;padding:24px 16px;display:flex;flex-direction:column;align-items:center;gap:16px;min-height:150px;justify-content:center\"><div style=\"position:relative;width:60px;height:60px;display:grid;place-items:center\"><span style=\"position:absolute;width:52px;height:52px;border-radius:50%;border:1.5px solid #FFD27A\"><\u002Fspan><span style=\"width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 34% 30%,#F0E8FF 0%,#9C7CF0 40%,#241452 100%);box-shadow:0 0 30px 6px rgba(156,124,240,.4),inset -6px -8px 14px rgba(0,0,0,.35)\"><\u002Fspan><\u002Fdiv><span style=\"font:400 12px 'Martian Mono',monospace;letter-spacing:.06em;color:#A9A3C2\">selected · solid and crisp<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<p style=\"margin:0;color:#A9A3C2;font-size:15px;max-width:680px\">Same language as the galaxy’s systems. A planet becomes a solid sphere only when selected to enter it; the selection ring takes the system color.<\u002Fp>\n\n<h3 style=\"margin:16px 0 0;font:500 12px 'Martian Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:#A9A3C2\">Intro · hold<\u002Fh3>\n<div style=\"display:flex;flex-wrap:wrap;gap:32px;align-items:center;background:#07060F;border-radius:6px;padding:28px\">\n<div style=\"position:relative;width:96px;height:96px;border-radius:50%;background:rgba(242,238,230,.04);display:grid;place-items:center;flex:none\"><svg width=\"96\" height=\"96\" sc-camel-view-box=\"0 0 96 96\" style=\"position:absolute;inset:0\" aria-hidden=\"true\"><circle cx=\"48\" cy=\"48\" r=\"44\" fill=\"none\" stroke=\"rgba(242,238,230,.2)\" stroke-width=\"2\"><\u002Fcircle><circle cx=\"48\" cy=\"48\" r=\"44\" fill=\"none\" stroke=\"#7FE6F2\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-dasharray=\"276.5\" stroke-dashoffset=\"110\" transform=\"rotate(-90 48 48)\"><\u002Fcircle><\u002Fsvg><span style=\"width:18px;height:18px;border:1.5px solid #F2EEE6;transform:rotate(45deg)\"><\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:6px;font:400 12px 'Martian Mono',monospace;letter-spacing:.06em;letter-spacing:.1em;color:#A9A3C2;min-width:220px\"><span style=\"display:flex;justify-content:space-between\"><span>SYSTEMS<\u002Fspan><span style=\"color:#7FE6F2\">OK<\u002Fspan><\u002Fspan><span style=\"display:flex;justify-content:space-between\"><span>ROUTES<\u002Fspan><span style=\"color:#7FE6F2\">OK<\u002Fspan><\u002Fspan><span style=\"display:flex;justify-content:space-between\"><span>DRIVE<\u002Fspan><span style=\"color:#FFD27A\">READY<\u002Fspan><\u002Fspan><\u002Fdiv>\n<p style=\"margin:0;flex:1 1 260px;color:#A9A3C2;font-size:15px\">1.2s ring while holding; a single click or the keyboard launches immediately. “Skip intro” always visible. Tweak: always / first visit / never.<\u002Fp>\n<\u002Fdiv>\n\n<h3 style=\"margin:16px 0 0;font:500 12px 'Martian Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:#A9A3C2\">First-visit guide<\u002Fh3>\n<div style=\"display:flex;flex-wrap:wrap;gap:24px;align-items:center\">\n<div style=\"width:min(100%,480px);background:rgba(21,19,46,.94);border:1px solid rgba(242,238,230,.18);border-radius:6px;padding:16px;display:flex;gap:16px;align-items:center\">\n<div style=\"width:56px;height:56px;flex:none;border-radius:50%;border:1px solid rgba(242,238,230,.18);display:grid;place-items:center\"><span style=\"width:10px;height:10px;border-radius:50%;background:#7FE6F2;box-shadow:0 0 12px 3px rgba(127,230,242,.5)\"><\u002Fspan><\u002Fdiv>\n<div style=\"flex:1;display:flex;flex-direction:column;gap:2px\"><span style=\"font:400 12px 'Martian Mono',monospace;letter-spacing:.06em;color:#A9A3C2\">1 / 3<\u002Fspan><span style=\"font:600 18px/1.2 'Bricolage Grotesque',sans-serif\">Drag to rotate<\u002Fspan><span style=\"font-size:15px;color:#D9D4E6\">Tip text.<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:4px\"><span style=\"min-height:44px;padding:0 14px;border-radius:4px;background:#7FE6F2;color:#0B0A1F;font:600 15px 'Hanken Grotesk',sans-serif;display:flex;align-items:center\">Next<\u002Fspan><span style=\"min-height:44px;padding:0 14px;color:#D9D4E6;text-decoration:underline;display:flex;align-items:center;font-size:14px\">Jump<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<p style=\"margin:0;flex:1 1 260px;color:#A9A3C2;font-size:15px\">Three steps with an animated icon. Also advances when the action is performed. Desktop: bottom right; mobile: top center. Hidden while a system card is open.<\u002Fp>\n<\u002Fdiv>\n\n<h3 style=\"margin:16px 0 0;font:500 12px 'Martian Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:#A9A3C2\">Audio · toggle<\u002Fh3>\n<div style=\"display:flex;gap:12px;align-items:center;flex-wrap:wrap\">\n<span style=\"min-height:44px;min-width:44px;padding:0 11px;border:1px solid rgba(242,238,230,.32);border-radius:4px;background:rgba(11,10,31,.4);color:#F2EEE6;cursor:pointer;display:grid;place-items:center\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 20 20\" aria-hidden=\"true\"><path d=\"M3 8h3l4-3v10l-4-3H3z\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-linejoin=\"round\"><\u002Fpath><path d=\"M13 8l4 4M17 8l-4 4\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n<span style=\"min-height:44px;min-width:44px;padding:0 11px;border:1px solid rgba(242,238,230,.32);border-radius:4px;background:rgba(11,10,31,.4);color:#F2EEE6;cursor:pointer;display:grid;place-items:center\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 20 20\" aria-hidden=\"true\"><path d=\"M3 8h3l4-3v10l-4-3H3z\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-linejoin=\"round\"><\u002Fpath><path d=\"M13 7.5a3.5 3.5 0 0 1 0 5M15.2 5.2a6.6 6.6 0 0 1 0 9.6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n<span style=\"color:#A9A3C2;font-size:15px\">Off by default, aria-pressed, preference remembered. Ambient bed + select, jump and landing sounds.<\u002Fspan>\n<\u002Fdiv>\n\n<h3 style=\"margin:16px 0 0;font:500 12px 'Martian Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:#A9A3C2\">Planet page · shared structure<\u002Fh3>\n<div style=\"position:relative;height:260px;border-radius:6px;overflow:hidden;background:#0B0A1F;border:1px solid rgba(242,238,230,.12)\">\n<div style=\"position:absolute;left:24px;top:28px;display:flex;flex-direction:column;gap:10px\"><span style=\"font:400 12px 'Martian Mono',monospace;letter-spacing:.06em;color:#FF7A6B\">SYS-03 · PROCESS · 02<\u002Fspan><span style=\"font:700 56px/.86 'Bricolage Grotesque',sans-serif;font-variation-settings:'wdth' 76;letter-spacing:-.04em\">Title<\u002Fspan><span style=\"display:block;height:12px;width:60%;border-radius:3px;background:rgba(242,238,230,0.16)\"><\u002Fspan><\u002Fdiv>\n<div style=\"position:absolute;left:50%;top:170px;width:1400px;aspect-ratio:1;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle at 50% 0%,#E6B04E 0%,#4A300C 7%,#07060F 38%);box-shadow:0 -10px 140px 18px rgba(255,122,107,.32),inset 0 3px 0 #FFF4D6,inset 0 26px 70px rgba(255,255,255,.16)\"><\u002Fdiv>\n<\u002Fdiv>\n<p style=\"margin:0;color:#A9A3C2;font-size:15px;max-width:680px\">Fixed bar (back to system, breadcrumb, audio) · display title 56–168px · planet horizon in its colors · content rests on the planet’s shadow color and fades into the void · at the bottom, previous and next planet.<\u002Fp>\n\n<h3 style=\"margin:16px 0 0;font:500 12px 'Martian Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:#A9A3C2\">Planet page · variants by type<\u002Fh3>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px\">\n<div style=\"background:#15132E;border-radius:6px;padding:18px;display:flex;flex-direction:column;gap:8px\"><span style=\"font:400 12px 'Martian Mono',monospace;letter-spacing:.06em;color:#7FE6F2\">type: case<\u002Fspan><span style=\"font:600 19px 'Bricolage Grotesque',sans-serif\">Case study<\u002Fspan><span style=\"color:#A9A3C2;font-size:15px\">6-leg logbook: brief, mark, color and voice, map, jump, system, each with a live demo.<\u002Fspan><\u002Fdiv>\n<div style=\"background:#15132E;border-radius:6px;padding:18px;display:flex;flex-direction:column;gap:8px\"><span style=\"font:400 12px 'Martian Mono',monospace;letter-spacing:.06em;color:#7FE6F2\">type: service<\u002Fspan><span style=\"font:600 19px 'Bricolage Grotesque',sans-serif\">Service<\u002Fspan><span style=\"color:#A9A3C2;font-size:15px\">“What’s included” in 4 numbered points + “Related work” linking to the project’s planet.<\u002Fspan><\u002Fdiv>\n<div style=\"background:#15132E;border-radius:6px;padding:18px;display:flex;flex-direction:column;gap:8px\"><span style=\"font:400 12px 'Martian Mono',monospace;letter-spacing:.06em;color:#7FE6F2\">type: step<\u002Fspan><span style=\"font:600 19px 'Bricolage Grotesque',sans-serif\">Stage<\u002Fspan><span style=\"color:#A9A3C2;font-size:15px\">4-stage track with the active stage in the system color, “What happens” and “What you get”.<\u002Fspan><\u002Fdiv>\n<div style=\"background:#15132E;border-radius:6px;padding:18px;display:flex;flex-direction:column;gap:8px\"><span style=\"font:400 12px 'Martian Mono',monospace;letter-spacing:.06em;color:#7FE6F2\">type: crew<\u002Fspan><span style=\"font:600 19px 'Bricolage Grotesque',sans-serif\">Crew<\u002Fspan><span style=\"color:#A9A3C2;font-size:15px\">Grid of circular portraits (moons) with name and role.<\u002Fspan><\u002Fdiv>\n<div style=\"background:#15132E;border-radius:6px;padding:18px;display:flex;flex-direction:column;gap:8px\"><span style=\"font:400 12px 'Martian Mono',monospace;letter-spacing:.06em;color:#7FE6F2\">type: about<\u002Fspan><span style=\"font:600 19px 'Bricolage Grotesque',sans-serif\">Story<\u002Fspan><span style=\"color:#A9A3C2;font-size:15px\">Wide image + three numbered blocks.<\u002Fspan><\u002Fdiv>\n<div style=\"background:#15132E;border-radius:6px;padding:18px;display:flex;flex-direction:column;gap:8px\"><span style=\"font:400 12px 'Martian Mono',monospace;letter-spacing:.06em;color:#7FE6F2\">type: contact<\u002Fspan><span style=\"font:600 19px 'Bricolage Grotesque',sans-serif\">Details<\u002Fspan><span style=\"color:#A9A3C2;font-size:15px\">Full-width label/value list.<\u002Fspan><\u002Fdiv>\n<div style=\"background:#15132E;border-radius:6px;padding:18px;display:flex;flex-direction:column;gap:8px\"><span style=\"font:400 12px 'Martian Mono',monospace;letter-spacing:.06em;color:#7FE6F2\">type: form<\u002Fspan><span style=\"font:600 19px 'Bricolage Grotesque',sans-serif\">Form<\u002Fspan><span style=\"color:#A9A3C2;font-size:15px\">Name, email, message. Visible labels, helper text below the field, pink error with icon next to the field, focus on the first invalid field, sending state and confirmation.<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<p style=\"margin:0;color:#A9A3C2;font-size:15px;max-width:680px\">Placeholders: bars for text and dashed boxes for images, until final copy arrives.<\u002Fp>\n<\u002Fsection>\n\n<section style=\"display:flex;flex-direction:column;gap:32px\">\n<div style=\"display:flex;align-items:baseline;gap:16px;border-bottom:1px solid rgba(242,238,230,.14);padding-bottom:16px\"><span style=\"font:500 12px 'Martian Mono',monospace;color:#7FE6F2\">09<\u002Fspan><h2 style=\"margin:0;font:600 36px/1.1 'Bricolage Grotesque',sans-serif;font-variation-settings:'wdth' 85\">Map accessibility<\u002Fh2><\u002Fdiv>\n<ul style=\"margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px 32px;color:#D9D4E6\">\n<li style=\"display:flex;gap:12px;padding:12px 0;border-bottom:1px solid rgba(242,238,230,.1)\"><span style=\"font:400 12px 'Martian Mono',monospace;color:#7FE6F2;padding-top:4px\">→<\u002Fspan>Stars are buttons in logical order (Tab), not random spatial order.<\u002Fli>\n<li style=\"display:flex;gap:12px;padding:12px 0;border-bottom:1px solid rgba(242,238,230,.1)\"><span style=\"font:400 12px 'Martian Mono',monospace;color:#7FE6F2;padding-top:4px\">→<\u002Fspan>List view always one key away: same information, no map.<\u002Fli>\n<li style=\"display:flex;gap:12px;padding:12px 0;border-bottom:1px solid rgba(242,238,230,.1)\"><span style=\"font:400 12px 'Martian Mono',monospace;color:#7FE6F2;padding-top:4px\">→<\u002Fspan>Every system and planet has a URL (/work, /work/skyward). Browser back = reverse jump.<\u002Fli>\n<li style=\"display:flex;gap:12px;padding:12px 0;border-bottom:1px solid rgba(242,238,230,.1)\"><span style=\"font:400 12px 'Martian Mono',monospace;color:#7FE6F2;padding-top:4px\">→<\u002Fspan>After a jump, focus moves to the system title, announced by a live region.<\u002Fli>\n<li style=\"display:flex;gap:12px;padding:12px 0;border-bottom:1px solid rgba(242,238,230,.1)\"><span style=\"font:400 12px 'Martian Mono',monospace;color:#7FE6F2;padding-top:4px\">→<\u002Fspan>Galaxy canvas is aria-hidden; only systems and planets are in the accessibility tree. “You are here” is announced in the button name.<\u002Fli>\n<li style=\"display:flex;gap:12px;padding:12px 0;border-bottom:1px solid rgba(242,238,230,.1)\"><span style=\"font:400 12px 'Martian Mono',monospace;color:#7FE6F2;padding-top:4px\">→<\u002Fspan>2px signal focus ring with 3px offset. Never removed.<\u002Fli>\n<\u002Ful>\n<\u002Fsection>\n\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n\n\n<\u002Fbody><\u002Fhtml>"
