name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # package-lock.json must be committed and in sync with package.json (run `npm install` locally).
      - name: Install
        run: npm ci

      - name: Build (prerendered, base /SkywardStudio/)
        run: npm run build:pages

      - name: SPA fallback and disable Jekyll
        working-directory: dist/skyward/browser
        run: |
          if [ -f index.csr.html ]; then cp index.csr.html 404.html; else cp index.html 404.html; fi
          touch .nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/skyward/browser

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
