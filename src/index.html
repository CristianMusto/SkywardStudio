<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <title>Skyward</title>
    <base href="/" />
    <script>
      // Old mockup links used hash routes ("…?return=1#/work/skyward", e.g. from the design system):
      // send them to the real page instead of letting the app fall back to the galaxy.
      (function () {
        var m = /^#\/([\w-]+(?:\/[\w-]+)?)$/.exec(location.hash);
        if (!m) return;
        var back = null;
        try {
          back = sessionStorage.getItem('skyward.dsReturn');
        } catch (e) {}
        var ok = back && back.charAt(0) === '/' && back.charAt(1) !== '/';
        var lang = /\/en(\/|$)/.test(location.pathname) ? 'en' : 'it';
        location.replace(ok ? back : new URL(lang + '/' + m[1], document.baseURI).href);
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0B0A1F" />
    <meta
      name="description"
      content="Cristian Musto, designer and web developer. Sophisticated, modern websites, from the first sketch to launch."
    />
    <meta property="og:title" content="Skyward · Your idea, in orbit." />
    <meta
      property="og:description"
      content="Cristian Musto, designer and web developer. Sophisticated, modern websites, from the first sketch to launch."
    />
    <meta property="og:image" content="assets/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <script>
      try {
        if (sessionStorage.getItem('skyward.langSwitch') === '1')
          document.documentElement.setAttribute('data-sk-veil', '');
      } catch (e) {}
    </script>
  </head>
  <body>
    <sky-root></sky-root>
  </body>
</html>
