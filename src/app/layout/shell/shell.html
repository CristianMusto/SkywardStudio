@if (store.browser) {
  @let v = store.view();
  @let t = store.strings();
  <main class="main">
    <div class="sky" [skyRef]="v?.skyRef" aria-hidden="true"></div>
    <div class="live-region" aria-live="polite">
      {{ txt(v?.live) }}
    </div>
    <div class="planet-zoom" [skyRef]="v?.zoomRef" aria-hidden="true"></div>
    <router-outlet></router-outlet>
    @if (v?.introOn) {
      <sky-intro-screen [v]="v" [t]="t"></sky-intro-screen>
    }
    @if (v?.lostOn) {
      <sky-not-found [v]="v" [t]="t"></sky-not-found>
    }
  </main>
  <!-- Outside main: the 404 screen makes main inert, the dialog must stay usable. -->
  <sky-shortcuts [t]="t"></sky-shortcuts>
}
