@let v = vm();
@let t = tr();
<div class="service">
  <div class="service-included">
    <h2 class="section-title">
      {{ t.whatSIncluded }}
    </h2>
    <ol class="included-list">
      @for (it of v?.page?.items ?? []; track $index) {
        <li class="included-item">
          <span class="item-num" [style.--color]="txt(v?.page?.hex)">{{ txt(it?.n) }}</span
          ><span class="item-text"
            ><span class="item-name">{{ txt(it?.t) }}</span
            ><span class="item-desc">{{ txt(it?.d) }}</span></span
          >
        </li>
      }
    </ol>
  </div>
  <div class="service-proof">
    <h2 class="section-title">
      {{ t.relatedWork }}
    </h2>
    <button class="proof-card" (click)="call(v?.page?.goCase, $event)">
      <span class="proof-planet" aria-hidden="true"></span
      ><span class="proof-text"
        ><span class="proof-meta">{{ t.sys01Work }}</span
        ><span class="proof-name">Skyward</span></span
      >
    </button>
  </div>
</div>
