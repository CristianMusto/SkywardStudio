@let v = vm();
@let t = tr();
<nav class="step-rail" [attr.aria-label]="t.processStages">
  <ol class="rail-list">
    @for (r of v?.page?.rail ?? []; track $index) {
      <li>
        <button
          class="rail-step"
          (click)="call(r?.go, $event)"
          [attr.aria-current]="r?.cur"
          [style.--border]="txt(r?.border)"
          [style.--background]="txt(r?.bg)"
        >
          <span class="rail-dot"
            ><span
              class="rail-text"
              aria-hidden="true"
              [style.--background]="txt(r?.dot)"
              [style.--border]="txt(r?.dotBorder)"
            ></span
            ><span class="rail-meta">{{ txt(r?.idx) }} · {{ txt(r?.kind) }}</span></span
          ><span class="rail-name">{{ txt(r?.name) }}</span>
        </button>
      </li>
    }
  </ol>
</nav>
<div class="step-body">
  <div class="step-happens">
    <h2 class="section-title">
      {{ t.whatHappens }}
    </h2>
    <p class="step-text">
      {{ txt(v?.page?.happens) }}
    </p>
  </div>
  <div class="step-gets">
    <h2 class="section-title">
      {{ t.whatYouGet }}
    </h2>
    <ul class="gets-list">
      @for (g of v?.page?.gets ?? []; track $index) {
        <li class="gets-item">
          <svg class="check-icon" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
            <path
              d="M3.5 9.5l3.5 3.5 7.5-8"
              fill="none"
              [attr.stroke]="v?.page?.hex"
              stroke-width="1.8"
            ></path></svg
          ><span>{{ txt(g) }}</span>
        </li>
      }
    </ul>
  </div>
</div>
