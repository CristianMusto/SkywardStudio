@let v = vm();
@let t = tr();
<div
  class="coach"
  role="dialog"
  aria-labelledby="sk-coach-t"
  aria-describedby="sk-coach-d"
  [style.--left]="txt(v?.coachLeft)"
  [style.--right]="txt(v?.coachRight)"
  [style.--top]="txt(v?.coachTop)"
  [style.--bottom]="txt(v?.coachBottom)"
  [style.--transform]="txt(v?.coachTf)"
>
  <div class="coach-icon" aria-hidden="true">
    <sky-vn [n]="v?.coachIcon"></sky-vn>
  </div>
  <div class="coach-body">
    <span class="coach-count">{{ txt(v?.coachCount) }}</span
    ><span class="coach-t" id="sk-coach-t">{{ txt(v?.coachTitle) }}</span
    ><span class="coach-d" id="sk-coach-d">{{ txt(v?.coachText) }}</span>
  </div>
  <div class="coach-actions">
    <button class="btn-primary" (click)="call(v?.coachNext, $event)">
      {{ txt(v?.coachNextLabel) }}</button
    ><button class="btn-ghost" (click)="call(v?.coachSkip, $event)">
      {{ t.skip }}
    </button>
  </div>
</div>
