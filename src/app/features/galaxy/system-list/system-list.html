@let v = vm();
@let t = tr();
<div class="system-list" role="region" [attr.aria-label]="t.systemListView">
  <div class="list-items">
    @for (s of v?.systems ?? []; track $index) {
      <button class="list-item" (click)="call(s?.onJump, $event)">
        <span class="item-code">{{ txt(s?.code) }}</span
        ><span class="item-text"
          ><span class="item-name">{{ txt(s?.name) }}</span
          ><span class="item-desc">{{ txt(s?.desc) }}</span></span
        ><span class="item-meta" [style.--color]="txt(s?.listColor)">{{ txt(s?.listMeta) }}</span>
      </button>
    }
  </div>
</div>
