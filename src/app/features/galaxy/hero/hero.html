@let v = vm();
@let t = tr();
<section class="hero-section" [skyRef]="v?.heroRef" aria-labelledby="sk-hero">
  <span class="eyebrow">{{ txt(v?.heroEyebrow) }}</span>
  <h1 class="hero-title" id="sk-hero">
    {{ t.yourIdeaInOrbit }}
  </h1>
  <p class="hero-text">
    {{ t.iMCristianA }}
  </p>
  <div class="hero-actions">
    <button class="btn-primary" type="button" (click)="call(v?.heroWork, $event)">
      {{ t.heroSeeWork }}<span aria-hidden="true">→</span>
    </button>
    <button class="btn-ghost" type="button" (click)="call(v?.heroContact, $event)">
      {{ t.heroWriteMe }}
    </button>
  </div>
</section>
